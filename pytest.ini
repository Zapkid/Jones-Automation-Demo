[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -s
    -v
    --strict-markers
    --tb=short
    --alluredir=reports/allure_results
    --color=yes

markers =
    smoke: Critical happy-path coverage that must always pass.
    regression: Broad regression suite covering edge cases.
    call_back: Tests covering the "Request a call back" lead form.
    supported_envs(*envs): Restrict a test to specific environments (local, prod).

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_level = INFO
log_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
